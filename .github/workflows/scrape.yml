name: Scrape Gacha Codes

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Scraper
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: npm start
        
      - name: Commit and push updated codes.json
        run: |
          git config --global user.name "GachaCodeBot"
          git config --global user.email "bot@gachacodes.local"
          git add codes.json
          git commit -m "Auto-update codes.json" || echo "No changes to commit"
          git push
